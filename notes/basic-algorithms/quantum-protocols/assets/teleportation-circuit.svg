<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 390" role="img" aria-labelledby="title desc">
  <title id="title">Three-qubit teleportation circuit with classical corrections</title>
  <desc id="desc">Alice's input A controls a CNOT on her entangled half a, then receives a Hadamard. Alice measures A and a to obtain bits m1 and m2. Bob applies X controlled by m2 then Z controlled by m1 to his entangled half b.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#317c78"/></marker>
  </defs>
  <rect width="980" height="390" rx="18" fill="#f8fbfc"/>
  <text x="24" y="36" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#172033">Teleportation: Alice measures; Bob corrects</text>
  <text x="30" y="112" font-family="Segoe UI, sans-serif" font-size="20" fill="#172033">A: |ψ⟩</text>
  <text x="30" y="192" font-family="Segoe UI, sans-serif" font-size="20" fill="#172033">a: Bell half</text>
  <text x="30" y="292" font-family="Segoe UI, sans-serif" font-size="20" fill="#172033">b: Bell half</text>
  <line x1="156" y1="105" x2="566" y2="105" stroke="#506579" stroke-width="3"/>
  <line x1="156" y1="185" x2="566" y2="185" stroke="#506579" stroke-width="3"/>
  <line x1="156" y1="285" x2="924" y2="285" stroke="#506579" stroke-width="3"/>
  <line x1="252" y1="105" x2="252" y2="185" stroke="#5967b5" stroke-width="3"/>
  <circle cx="252" cy="105" r="8" fill="#5967b5"/>
  <circle cx="252" cy="185" r="18" fill="#fff" stroke="#5967b5" stroke-width="3"/>
  <path d="M240 185 H264 M252 173 V197" stroke="#5967b5" stroke-width="3"/>
  <rect x="326" y="80" width="50" height="50" rx="8" fill="#e0f2ef" stroke="#16867b" stroke-width="2"/>
  <text x="342" y="113" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#14665e">H</text>
  <rect x="455" y="80" width="74" height="50" rx="8" fill="#f0f3ff" stroke="#5967b5" stroke-width="2"/>
  <rect x="455" y="160" width="74" height="50" rx="8" fill="#f0f3ff" stroke="#5967b5" stroke-width="2"/>
  <text x="465" y="112" font-family="Segoe UI, sans-serif" font-size="16" fill="#394785">measure</text>
  <text x="465" y="192" font-family="Segoe UI, sans-serif" font-size="16" fill="#394785">measure</text>
  <line x1="529" y1="105" x2="660" y2="105" stroke="#317c78" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <line x1="529" y1="185" x2="632" y2="185" stroke="#317c78" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="578" y="95" font-family="Segoe UI, sans-serif" font-size="18" fill="#14665e">m₁</text>
  <text x="565" y="177" font-family="Segoe UI, sans-serif" font-size="18" fill="#14665e">m₂</text>
  <line x1="660" y1="105" x2="660" y2="250" stroke="#317c78" stroke-width="2.5" stroke-dasharray="7 5"/>
  <line x1="632" y1="185" x2="632" y2="250" stroke="#317c78" stroke-width="2.5" stroke-dasharray="7 5"/>
  <rect x="610" y="255" width="76" height="60" rx="8" fill="#e0f2ef" stroke="#16867b" stroke-width="2"/>
  <text x="626" y="292" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#14665e">Xᵐ²</text>
  <rect x="754" y="255" width="76" height="60" rx="8" fill="#e0f2ef" stroke="#16867b" stroke-width="2"/>
  <text x="769" y="292" font-family="Segoe UI, sans-serif" font-size="22" font-weight="700" fill="#14665e">Zᵐ¹</text>
  <path d="M660 250 C660 222 792 222 792 250" fill="none" stroke="#317c78" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
  <text x="843" y="292" font-family="Segoe UI, sans-serif" font-size="20" font-weight="700" fill="#172033">|ψ⟩</text>
  <text x="167" y="356" font-family="Segoe UI, sans-serif" font-size="16" fill="#4f6171">a and b start as one shared Bell pair. Dashed lines are ordinary classical bits.</text>
</svg>
