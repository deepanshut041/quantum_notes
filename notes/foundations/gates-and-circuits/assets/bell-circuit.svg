<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-labelledby="title desc">
  <title id="title">Bell-state circuit</title>
  <desc id="desc">Two input qubits start in zero. A Hadamard acts on the first wire, then the first wire controls an X gate on the second wire. Both wires are measured.</desc>
  <rect width="820" height="250" rx="18" fill="#f8fbff"/>
  <g stroke="#254b72" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M92 75 H748 M92 174 H748"/>
    <rect x="225" y="46" width="62" height="58" rx="8" fill="#e5f2ff"/>
    <path d="M422 75 V174"/>
    <circle cx="422" cy="75" r="8" fill="#254b72"/>
    <circle cx="422" cy="174" r="25" fill="#fff"/>
    <path d="M398 174 H446"/>
    <rect x="615" y="46" width="56" height="58" rx="8" fill="#f6eede"/>
    <rect x="615" y="145" width="56" height="58" rx="8" fill="#f6eede"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#173454" font-size="24">
    <text x="24" y="84">|0⟩</text><text x="24" y="183">|0⟩</text>
    <text x="243" y="84">H</text>
    <text x="632" y="84">M</text><text x="632" y="183">M</text>
    <text x="689" y="84" font-size="19">A</text><text x="689" y="183" font-size="19">B</text>
  </g>
  <text x="160" y="228" fill="#47627e" font-family="Arial, sans-serif" font-size="17">H on A → CNOT from A to B → computational-basis measurement</text>
</svg>
