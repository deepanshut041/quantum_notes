<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 520" role="img" aria-labelledby="title desc">
  <title id="title">Bloch sphere coordinate guide</title>
  <desc id="desc">A unit sphere with z vertical, x horizontal, y diagonal, the six Pauli eigenstate directions, and a general state vector.</desc>
  <rect width="760" height="520" rx="20" fill="#f8fbff"/>
  <g transform="translate(360 260)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle r="176" stroke="#9bb3d0" stroke-width="3"/>
    <ellipse rx="176" ry="57" stroke="#9bb3d0" stroke-width="2.5"/>
    <path d="M-130 116 Q0 -118 130 -116" stroke="#a9bed6" stroke-width="2" stroke-dasharray="6 7"/>
    <path d="M-130 116 Q0 118 130 -116" stroke="#a9bed6" stroke-width="2"/>
    <path d="M0 197 V-207" stroke="#28476d" stroke-width="3"/>
    <path d="M-202 0 H205" stroke="#28476d" stroke-width="3"/>
    <path d="M-140 110 L142 -112" stroke="#28476d" stroke-width="3"/>
    <path d="M0 0 L87 -128" stroke="#df6b43" stroke-width="5"/>
    <path d="M0 -68 A68 68 0 0 1 39 -55" stroke="#df6b43" stroke-width="2"/>
    <circle cx="87" cy="-128" r="6" fill="#df6b43" stroke="none"/>
    <circle r="4" fill="#28476d" stroke="none"/>
  </g>
  <g font-family="Arial, sans-serif" fill="#173454" font-size="21">
    <text x="372" y="43">+z  |0⟩</text>
    <text x="372" y="495">−z  |1⟩</text>
    <text x="575" y="252">+x  |+⟩</text>
    <text x="73" y="252">−x  |−⟩</text>
    <text x="492" y="135">+y  |+i⟩</text>
    <text x="125" y="392">−y  |−i⟩</text>
    <text x="454" y="122" fill="#a84424">|ψ⟩</text>
    <text x="390" y="206" fill="#a84424">θ</text>
    <text x="309" y="284">O</text>
  </g>
  <text x="21" y="30" fill="#47627e" font-family="Arial, sans-serif" font-size="17">Schematic perspective: the six axis states are exact; the orange arrow illustrates a general pure qubit.</text>
</svg>
